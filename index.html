<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Are You Beautiful?</title>
    <style>
        body { 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #ffe4e1; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .container { 
            text-align: center; 
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 {
            color: #d81b60;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 60px;
            width: 100%;
        }
        .btn { 
            padding: 12px 35px; 
            font-size: 20px; 
            font-weight: bold;
            cursor: pointer; 
            border: none;
            border-radius: 50px;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }
        #yes-btn { 
            background-color: #4CAF50; 
            color: white; 
        }
        #yes-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }
        #no-btn { 
            background-color: #f44336; 
            color: white; 
            position: relative;
            transition: all 0.1s ease;
            z-index: 1000;
        }
        #message {
            display: none;
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
            margin-top: 20px;
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <h1 id="question">Are you beautiful?</h1>
        <div class="buttons" id="btn-group">
            <button class="btn" id="yes-btn">Yes</button>
        <audio id="success-audio" src="moaning-sounds-during-simulation.mp3"></audio>
            <button class="btn" id="no-btn">No</button>
        </div>
        <div id="message">You are! ✨</div>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const message = document.getElementById('message');
        const question = document.getElementById('question');
        const btnGroup = document.getElementById('btn-group');

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        function moveNoButton() {
            // Switch to fixed positioning on the first movement
            if (noBtn.style.position !== 'fixed') {
                noBtn.style.position = 'fixed';
            }

            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            const randomX = Math.max(padding, Math.random() * maxX);
            const randomY = Math.max(padding, Math.random() * maxY);
            
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        yesBtn.addEventListener('click', () => {
            const audio = document.getElementById('success-audio');
            audio.volume = 1.0; // Set player volume to max
            audio.play().catch(e => console.error("Audio playback failed:", e));

            question.style.display = 'none';
            btnGroup.style.display = 'none';
            message.style.display = 'block';
            noBtn.style.display = 'none';
            
            document.body.style.backgroundColor = '#e8f5e9';
        });
    </script>
</body>
</html>
